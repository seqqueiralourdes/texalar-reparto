<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0C447C">
  <title>Texalar Reparto</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">

    <!-- Header con estadísticas del día -->
    <header class="header">
      <div class="header-top">
        <div class="header-logo">
          <div class="header-logo-icon">💧</div>
          <span class="header-logo-name">Texalar</span>
        </div>
        <span class="header-date" id="fecha-hoy"></span>
      </div>
      <div class="header-stats">
        <div class="hstat">
          <div class="hstat-label">Clientes visitados</div>
          <div class="hstat-val" id="stat-clientes">0/0</div>
        </div>
        <div class="hstat">
          <div class="hstat-label">Bidones entregados</div>
          <div class="hstat-val" id="stat-bidones">0</div>
        </div>
      </div>
    </header>

    <!-- Barra de progreso -->
    <div class="progress-wrap">
      <div class="progress-top">
        <span>Progreso del reparto</span>
        <span id="prog-pct">0%</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar" id="prog-bar" style="width:0%"></div>
      </div>
    </div>

    <!-- Navegación -->
    <nav class="nav">
      <button class="nav-item active" onclick="showTab('ruta', this)">
        <span class="nav-icon">🗺️</span>
        Ruta
      </button>
      <button class="nav-item" onclick="showTab('clientes', this)">
        <span class="nav-icon">👤</span>
        Clientes
      </button>
      <button class="nav-item" onclick="showTab('historial', this)">
        <span class="nav-icon">📋</span>
        Historial
      </button>
    </nav>

    <!-- Sección: Hoja de ruta -->
    <section id="sec-ruta" class="section active">
      <div class="sec-title">Ruta de hoy</div>
      <div id="ruta-list"></div>
    </section>

    <!-- Botón cerrar reparto (fuera de la sección para posición fija) -->
    <div class="cerrar-wrap" id="cerrar-wrap" style="display:none;">
      <button class="cerrar-btn" onclick="cerrarReparto()">Cerrar reparto del día</button>
    </div>

    <!-- Sección: Clientes -->
    <section id="sec-clientes" class="section">
      <div class="form-card">
        <div class="form-title">Agregar cliente</div>
        <div class="form-group">
          <label class="form-label" for="inp-nombre">Nombre completo</label>
          <input class="form-input" type="text" id="inp-nombre" placeholder="Ej: Juan García">
        </div>
        <div class="form-group">
          <label class="form-label" for="inp-dir">Dirección</label>
          <input class="form-input" type="text" id="inp-dir" placeholder="Ej: Av. San Martín 1234">
        </div>
        <div class="form-group">
          <label class="form-label" for="inp-tel">Teléfono</label>
          <input class="form-input" type="tel" id="inp-tel" placeholder="Ej: 11 1234-5678">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="inp-bid">Bidones habituales</label>
            <input class="form-input" type="number" id="inp-bid" placeholder="2" min="1" max="50">
          </div>
          <div class="form-group">
            <label class="form-label" for="inp-orden">Orden en ruta</label>
            <input class="form-input" type="number" id="inp-orden" placeholder="Ej: 3" min="1">
          </div>
        </div>
        <button class="add-btn" onclick="agregarCliente()">+ Agregar cliente</button>
      </div>
      <div class="sec-title">Clientes activos</div>
      <div id="clientes-list"></div>
    </section>

    <!-- Sección: Historial -->
    <section id="sec-historial" class="section">
      <div class="sec-title">Repartos anteriores</div>
      <div id="hist-list"></div>
    </section>

  </div>

  <script src="app.js"></script>
</body>
</html>
