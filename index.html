<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0C447C">
  <title>Texalar Reparto</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ═══ PANTALLA DE LOGIN ═══ -->
  <div id="pantalla-login" class="login-screen">
    <div class="login-card">
      <div class="login-logo">
        <i class="ti ti-droplet"></i>
      </div>
      <h1 class="login-title">Texalar</h1>
      <p class="login-sub">Gestión de reparto de agua</p>

      <div id="login-error" class="login-error" style="display:none;"></div>

      <div class="field-group">
        <label class="field-label">Usuario</label>
        <input id="login-usuario" class="input" type="text" placeholder="Nombre de usuario" autocomplete="username">
      </div>
      <div class="field-group">
        <label class="field-label">Clave</label>
        <input id="login-clave" class="input" type="password" placeholder="••••••" autocomplete="current-password">
      </div>
      <button class="btn btn-primary" style="width:100%;margin-top:8px;" onclick="doLogin()">
        <i class="ti ti-login"></i> Ingresar
      </button>
    </div>
  </div>

  <!-- ═══ APP PRINCIPAL (empleado) ═══ -->
  <div id="pantalla-app" class="app" style="display:none;">

    <!-- Header -->
    <div class="header">
      <div class="header-top">
        <div>
          <div class="header-title"><img src="icon-192.png" style="width:28px;height:28px;vertical-align:middle;margin-right:8px;border-radius:6px;">Texalar Reparto</div>
          <div id="fecha-hoy" class="header-date"></div>
        </div>
        <div style="display:flex;align-items:center;gap:10px;">
          <span id="header-usuario" style="font-size:13px;color:rgba(255,255,255,0.8);"></span>
          <button class="icon-btn" onclick="doLogout()" title="Salir">
            <i class="ti ti-logout" style="color:rgba(255,255,255,0.8);font-size:20px;"></i>
          </button>
        </div>
      </div>
      <div class="stats-row">
        <div class="stat-box">
          <div class="stat-val" id="stat-entregas">0</div>
          <div class="stat-lbl">Entregas</div>
        </div>
        <div class="stat-box">
          <div class="stat-val" id="stat-bid5">0</div>
          <div class="stat-lbl">Bidones 5L</div>
        </div>
        <div class="stat-box">
          <div class="stat-val" id="stat-bid10">0</div>
          <div class="stat-lbl">Bidones 10L</div>
        </div>
        <div class="stat-box">
          <div id="stat-total" class="stat-val">$0</div>
          <div class="stat-lbl">Total</div>
        </div>
      </div>
    </div>

    <!-- Zona selector -->
    <div class="zona-bar">
      <div id="zona-selector-wrap">
        <div class="zona-label">Zona de hoy</div>
        <div id="zona-selector"></div>
      </div>
      <div id="exportar-wrap" style="display:none;">
        <button class="btn btn-outline btn-sm" onclick="exportarResumen()">
          <i class="ti ti-share"></i> Exportar
        </button>
      </div>
    </div>

    <!-- Secciones -->
    <div id="sec-ruta" class="section active">
      <div id="ruta-list"></div>
    </div>

    <div id="sec-historial" class="section">
      <div id="hist-list"></div>
    </div>

    <div id="sec-pendientes" class="section">
      <div id="pendientes-list"></div>
    </div>

    <div id="sec-clientes" class="section">
      <div class="section-header">
        <span>Clientes</span>
        <button class="btn btn-sm btn-primary" onclick="showAddCliente()">
          <i class="ti ti-plus"></i> Agregar
        </button>
      </div>
      <div id="clientes-list"></div>
    </div>

    <div id="sec-zonas" class="section">
      <div class="section-header">
        <span>Zonas</span>
        <button class="btn btn-sm btn-primary" onclick="showAddZona()">
          <i class="ti ti-plus"></i> Agregar
        </button>
      </div>
      <div id="zonas-list"></div>
    </div>

    <!-- Nav -->
    <nav class="nav">
      <button class="nav-item active" onclick="showTab('ruta',this)">
        <i class="ti ti-map-route"></i>
        <span>Ruta</span>
      </button>
      <button class="nav-item" onclick="showTab('historial',this)">
        <i class="ti ti-history"></i>
        <span>Historial</span>
      </button>
      <button class="nav-item" onclick="showTab('pendientes',this)">
        <i class="ti ti-clock-dollar"></i>
        <span>Pendientes</span>
      </button>
      <button class="nav-item" onclick="showTab('clientes',this)">
        <i class="ti ti-users"></i>
        <span>Clientes</span>
      </button>
      <button class="nav-item" onclick="showTab('zonas',this)">
        <i class="ti ti-map-pin"></i>
        <span>Zonas</span>
      </button>
    </nav>
  </div>

  <!-- ═══ PANEL ADMIN ═══ -->
  <div id="pantalla-admin" class="app" style="display:none;">
    <div class="header">
      <div class="header-top">
        <div>
          <div class="header-title">Texalar — Admin</div>
          <div id="admin-fecha" class="header-date"></div>
        </div>
        <button class="icon-btn" onclick="doLogout()" title="Salir">
          <i class="ti ti-logout" style="color:rgba(255,255,255,0.8);font-size:20px;"></i>
        </button>
      </div>
    </div>

    <div style="padding:16px;">
      <!-- Resumen del día -->
      <div class="card" style="margin-bottom:16px;">
        <div class="card-title" style="margin-bottom:12px;">
          <i class="ti ti-chart-bar"></i> Resumen de hoy
        </div>
        <div id="admin-resumen-hoy">
          <div class="empty">Cargando...</div>
        </div>
      </div>

      <!-- Empleados -->
      <div class="card" style="margin-bottom:16px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
          <div class="card-title"><i class="ti ti-users"></i> Empleados</div>
          <button class="btn btn-sm btn-primary" onclick="showAddEmpleado()">
            <i class="ti ti-plus"></i> Agregar
          </button>
        </div>
        <div id="admin-empleados-list"></div>
      </div>

      <!-- Historial general -->
      <div class="card">
        <div class="card-title" style="margin-bottom:12px;">
          <i class="ti ti-history"></i> Historial general
        </div>
        <div id="admin-historial"></div>
      </div>
    </div>
  </div>

  <!-- ═══ MODALES ═══ -->
  <div id="modal-overlay" class="modal-overlay" style="display:none;" onclick="closeModal()"></div>
  <div id="modal" class="modal" style="display:none;">
    <div id="modal-content"></div>
  </div>

  <!-- Loading overlay -->
  <div id="loading-overlay" class="loading-overlay" style="display:none;">
    <div class="loading-spinner">
      <i class="ti ti-droplet" style="font-size:32px;color:#0C447C;"></i>
      <div style="margin-top:8px;font-size:14px;color:#666;">Cargando...</div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
