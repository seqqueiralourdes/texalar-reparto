<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0C447C">
  <title>Texalar Reparto</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">

    <!-- Header -->
    <header class="header">
      <div class="header-top">
        <div class="header-logo">
          <div class="header-logo-icon">💧</div>
          <span class="header-logo-name">Texalar</span>
        </div>
        <span class="header-date" id="fecha-hoy"></span>
      </div>
      <div class="header-stats">
        <div class="hstat">
          <div class="hstat-label">Clientes visitados</div>
          <div class="hstat-val" id="stat-clientes">0/0</div>
        </div>
        <div class="hstat">
          <div class="hstat-label">Bidones entregados</div>
          <div class="hstat-val" id="stat-bidones">0</div>
        </div>
      </div>
    </header>

    <!-- Barra de progreso -->
    <div class="progress-wrap">
      <div class="progress-top">
        <span>Progreso del reparto</span>
        <span id="prog-pct">0%</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar" id="prog-bar" style="width:0%"></div>
      </div>
    </div>

    <!-- Navegación -->
    <nav class="nav">
      <button class="nav-item active" onclick="showTab('ruta', this)">
        <span class="nav-icon">🗺️</span>
        Ruta
      </button>
      <button class="nav-item" onclick="showTab('clientes', this)">
        <span class="nav-icon">👤</span>
        Clientes
      </button>
      <button class="nav-item" onclick="showTab('zonas', this)">
        <span class="nav-icon">📍</span>
        Zonas
      </button>
      <button class="nav-item" onclick="showTab('zonas', this)">
        <span class="nav-icon">📋</span>
        Historial
      </button>
    </nav>

    <!-- Sección: Ruta -->
    <section id="sec-ruta" class="section active">

      <!-- Selector de zona (se muestra si no hay zona elegida hoy) -->
      <div id="zona-selector">
        <div class="zona-selector-header">
          <div class="sec-title">¿Qué zona hacés hoy?</div>
        </div>
        <div id="zonas-opciones"></div>
      </div>

      <!-- Zona activa (se muestra si ya eligió zona) -->
      <div id="zona-activa" style="display:none;">
        <div class="zona-activa-bar">
          <div class="zona-activa-info">
            <span class="zona-activa-label">Zona de hoy</span>
            <span class="zona-activa-nombre" id="zona-activa-nombre"></span>
          </div>
          <button class="zona-cambiar-btn" onclick="cambiarZona()">Cambiar</button>
        </div>
      </div>

      <div class="sec-title" id="ruta-subtitle" style="margin-top:12px;">Ruta de hoy</div>
      <div id="ruta-list"></div>
    </section>

    <!-- Botón cerrar reparto -->
    <div class="cerrar-wrap" id="cerrar-wrap" style="display:none;">
      <button class="cerrar-btn" onclick="cerrarReparto()">Cerrar reparto del día</button>
    </div>

    <!-- Sección: Clientes -->
    <section id="sec-clientes" class="section">
      <div class="form-card">
        <div class="form-title">Agregar cliente</div>
        <div class="form-group">
          <label class="form-label" for="inp-nombre">Nombre completo</label>
          <input class="form-input" type="text" id="inp-nombre" placeholder="Ej: Juan García">
        </div>
        <div class="form-group">
          <label class="form-label" for="inp-dir">Dirección</label>
          <input class="form-input" type="text" id="inp-dir" placeholder="Ej: Av. San Martín 1234">
        </div>
        <div class="form-group">
          <label class="form-label" for="inp-tel">Teléfono</label>
          <input class="form-input" type="tel" id="inp-tel" placeholder="Ej: 11 1234-5678">
        </div>
        <div class="form-group">
          <label class="form-label" for="inp-zona-cliente">Zona</label>
          <select class="form-input" id="inp-zona-cliente">
            <option value="">Seleccioná una zona</option>
          </select>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="inp-bid">Bidones habituales</label>
            <input class="form-input" type="number" id="inp-bid" placeholder="2" min="1" max="50">
          </div>
          <div class="form-group">
            <label class="form-label" for="inp-orden">Orden en ruta</label>
            <input class="form-input" type="number" id="inp-orden" placeholder="Ej: 3" min="1">
          </div>
        </div>
        <button class="add-btn" onclick="agregarCliente()">+ Agregar cliente</button>
      </div>
      <div class="sec-title">Clientes activos</div>
      <div id="clientes-list"></div>
    </section>

    <!-- Sección: Zonas -->
    <section id="sec-zonas" class="section">
      <div class="form-card">
        <div class="form-title">Agregar zona</div>
        <div class="form-group">
          <label class="form-label" for="inp-zona">Nombre de la zona</label>
          <input class="form-input" type="text" id="inp-zona" placeholder="Ej: Zona Norte">
        </div>
        <button class="add-btn" onclick="agregarZona()">+ Agregar zona</button>
      </div>
      <div class="sec-title">Zonas activas</div>
      <div id="zonas-list"></div>
    </section>

    <!-- Sección: Historial -->
    <section id="sec-historial" class="section">
      <div class="sec-title">Repartos anteriores</div>
      <div id="hist-list"></div>
    </section>

  </div>

  <script src="app.js"></script>
</body>
</html>
